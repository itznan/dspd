[package]
name          = "dspd"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.80.0"
authors       = ["itznan"]
repository    = "https://github.com/itznan/dspd"
homepage      = "https://github.com/itznan/dspd"
documentation = "https://github.com/itznan/dspd#readme"
readme        = "README.md"
license       = "MIT"
description   = "Fast, safe, single-binary disk benchmarking for Windows, written in Rust."
keywords      = ["benchmark", "disk", "io", "windows", "nvme"]
categories    = ["command-line-utilities", "hardware-support"]
build         = "build.rs"

[lib]
name = "dspd"
path = "src/lib.rs"

[[bin]]
name = "dspd"
path = "src/main.rs"

[dependencies]
anyhow       = "1.0"
thiserror    = "2.0"
clap         = { version = "4.5", features = ["derive"] }
indicatif    = "0.18"
hdrhistogram = "7.5"
rand_xoshiro = "0.8.1"
rand_core    = "0.10"
chrono       = "0.4"
csv          = "1.3"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
opt-level = 1
