name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Version
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag and Version
        id: vars
        shell: pwsh
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $baseVer = $matches[1]
          } else {
            $baseVer = "0.2.0"
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
            $ver = $releaseTag.TrimStart('v')
          } else {
            # On branch push (e.g. main) or manual workflow_dispatch
            $runNum = $env:GITHUB_RUN_NUMBER
            $releaseTag = "v${baseVer}.${runNum}"
            $ver = "${baseVer}.${runNum}"
          }

          Write-Host "Base Version: $baseVer"
          Write-Host "Computed Release Tag: $releaseTag"
          Write-Host "Computed Version: $ver"

          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release executable
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package artifact & generate SHA256 checksum
        shell: pwsh
        run: |
          $tag    = "${{ needs.prepare.outputs.release_tag }}"
          $target = "${{ matrix.target }}"
          $dir    = "dspd-${tag}-${target}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${target}/release/dspd.exe" -Destination $dir
          Copy-Item "dspd.ps1" -Destination (Join-Path $dir "dspd-interactive.ps1")
          Copy-Item "README.md", "LICENSE" -Destination $dir
          $zip = "${dir}.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "${hash}  ${zip}" | Out-File -Encoding ascii "${zip}.sha256"
          Write-Host "Created release bundle: $zip (SHA256: $hash)"

      - name: Build Windows Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $target = "${{ matrix.target }}"
          $arch = if ($target -like "aarch64*") { "arm64" } else { "x86_64" }
          $archMode = if ($target -like "aarch64*") { "arm64" } else { "x64compatible" }

          $iscc = Get-Command "iscc.exe" -ErrorAction SilentlyContinue
          $isccPath = if ($iscc) { $iscc.Source } else { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }

          & $isccPath `
            "/DMyAppVersion=${ver}" `
            "/DMyAppTarget=${arch}" `
            "/DArchitectureMode=${archMode}" `
            "/DSourceExePath=..\target\${target}\release\dspd.exe" `
            "installer/dspd.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed with exit code $LASTEXITCODE" }

          $setupFile = "installer/Output/dspd-Setup-v${ver}-${arch}.exe"
          if (-not (Test-Path $setupFile)) { throw "Expected installer not found at $setupFile" }
          $hash = (Get-FileHash -Path $setupFile -Algorithm SHA256).Hash.ToLower()
          "${hash}  $(Split-Path $setupFile -Leaf)" | Out-File -Encoding ascii "${setupFile}.sha256"
          Write-Host "Created Windows Installer: $setupFile (SHA256: $hash)"

      - name: Stage build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "dspd-*.zip" -Destination dist/
          Copy-Item "dspd-*.zip.sha256" -Destination dist/
          Copy-Item "installer/Output/*.exe" -Destination dist/
          Copy-Item "installer/Output/*.sha256" -Destination dist/
          Get-ChildItem -Path dist | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, build]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Verify release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release-assets | Format-Table Name, Length
          $files = Get-ChildItem -Path release-assets -File
          Write-Host "Total assets downloaded: $($files.Count)"
          if ($files.Count -lt 8) {
            throw "Expected at least 8 release assets (2 zips, 2 zip sha256s, 2 exes, 2 exe sha256s), found $($files.Count)"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: dspd ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*
            dspd.ps1
          generate_release_notes: true
          make_latest: true
